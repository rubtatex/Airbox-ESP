# Publishes a firmware release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# The release carries the OTA image (airbox-esp-1.2.0.bin) and its SHA-256 (airbox-esp-1.2.0.bin.sha256).
# The Airbox iOS app reads the latest release of this repository to offer the update.
# The release text comes from CHANGELOG.md (see scripts/changelog.py).
# A stable release (no "-beta" suffix) also publishes the USB installer page, with the flash images,
# on GitHub Pages (branch gh-pages, see web/ and scripts/build-site.sh).
name: Release firmware

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host-side tests
        run: ./test/host/run.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION=\\\"$VERSION\\\"" pio run
          mkdir -p dist
          cp .pio/build/seeed_xiao_esp32c3/firmware.bin "dist/airbox-esp-$VERSION.bin"
          (cd dist && sha256sum "airbox-esp-$VERSION.bin" > "airbox-esp-$VERSION.bin.sha256")
          ls -l dist

      - name: Check the image fits an OTA slot
        run: |
          size=$(stat -c %s "dist/airbox-esp-$VERSION.bin")
          echo "image: $size bytes (slot: 1966080)"
          test "$size" -le 1966080

      - name: Release notes from CHANGELOG.md
        run: |
          python3 scripts/changelog.py check
          if python3 scripts/changelog.py notes "$VERSION" > notes.md; then
            echo "HAVE_NOTES=1" >> "$GITHUB_ENV"
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION: the release uses GitHub's generated notes."
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release already made from the GitHub web page: attach the files to it.
            gh release upload "$TAG" dist/* --clobber
            body="$(gh release view "$TAG" --json body --jq .body)"
            if [ -n "$HAVE_NOTES" ] && [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          elif [ -n "$HAVE_NOTES" ]; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Airbox firmware $VERSION" --notes-file notes.md $flags
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Airbox firmware $VERSION" --generate-notes $flags
          fi

      - name: Publish the USB installer on GitHub Pages
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          scripts/build-site.sh "$VERSION" site
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "USB installer $VERSION"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
