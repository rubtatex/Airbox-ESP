; PlatformIO Project Configuration File
;
; Airbox-ESP — breathing valve/pump controller (XIAO ESP32-C3)
; See .claude/CLAUDE.md for the architecture and the safety model.
;
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

; OTA enabled on 18/08/2026 (see .claude/CLAUDE.md, "OTA (over-the-network
; firmware update)") — standard 2 app slots scheme (ota_0/ota_1, ~1.875 MB each)
; + minimal spiffs (unused, no LittleFS). Replaces no_ota.csv (a single 2 MB
; partition, which made OTA physically impossible: no second slot to write the
; new image to while the old one runs). The firmware (~1.38 MB) fits
; comfortably in each 1.875 MB slot (~500 KB of headroom).
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DASYNCWEBSERVER_REGEX

lib_deps =
    olikraus/U8g2 @ ^2.35.30
    ricmoo/QRCode @ ^0.0.1
    bblanchon/ArduinoJson @ ^7.2.0
    h2zero/NimBLE-Arduino @ ^1.4.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.2
